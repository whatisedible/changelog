# Builds on every push and PR. Deploys to Cloudflare Pages when the
# CLOUDFLARE_API_TOKEN secret is present: main -> production
# (changelog.whatisedible.com), any other branch -> a preview URL.
name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5abdec7dda1b78a526732549a233aab8
          command: >-
            pages deploy build --project-name=changelog
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

      - name: Preview link on the PR
        if: env.HAS_TOKEN == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body "Preview: $URL"
